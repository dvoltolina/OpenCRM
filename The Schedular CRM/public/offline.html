<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline | The Scheduler CRM</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 12px;
        max-width: 480px;
        padding: 24px;
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.25);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
      }
      p {
        margin: 0 0 12px;
        line-height: 1.5;
      }
      .small {
        font-size: 14px;
        color: #94a3b8;
      }
      .button {
        display: inline-block;
        margin-top: 12px;
        padding: 10px 16px;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div class="card" role="status">
      <h1>Offline Mode</h1>
      <p>You’re offline. Cached pages are available, but live updates and secure actions require an internet connection.</p>
      <p class="small">No sensitive data is stored in this offline page. Reconnect to sync changes and refresh data.</p>
      <a class="button" href="/">Try Reload</a>
    </div>
  </body>
</html>
